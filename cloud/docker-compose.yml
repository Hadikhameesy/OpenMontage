services:
  api:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    command: uvicorn cloud.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    command: python -m cloud.worker
    env_file: .env
    environment:
      WORKER_ID: ${WORKER_ID:-openmontage-worker-1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
