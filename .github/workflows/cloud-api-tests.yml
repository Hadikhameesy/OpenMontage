name: Cloud API tests

on:
  pull_request:
    paths:
      - "cloud/api/**"
      - "tests/cloud/**"
      - "supabase/migrations/**"
      - "requirements*.txt"
      - ".github/workflows/cloud-api-tests.yml"
  push:
    branches:
      - cloud-web-foundation
    paths:
      - "cloud/api/**"
      - "tests/cloud/**"
      - "supabase/migrations/**"
      - "requirements*.txt"
      - ".github/workflows/cloud-api-tests.yml"

jobs:
  cloud-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install cloud API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn>=0.29" requests pyyaml "pydantic>=2" pytest httpx
      - name: Run cloud API contract tests
        run: python -m pytest -q tests/cloud/test_api.py
